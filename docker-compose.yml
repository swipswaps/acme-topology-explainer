services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: acme_audit_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - acme_sqlite_data:/app/data
    environment:
      - DATABASE_PATH=/app/data/audit.db
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  acme_sqlite_data:
